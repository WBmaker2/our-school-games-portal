<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 학교 명예의 전당 | 실시간 리더보드</title>
  <style>
    :root {
      --bg-dark: #0F172A;
      --card-bg: #1E293B;
      --text-main: #F8FAFC;
      --text-dim: #94A3B8;
      --school-gold: #FFD166;
      --neon-cyan: #00F5D4;
      --neon-pink: #FF006E;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .title span { color: var(--school-gold); }
    .subtitle {
      color: var(--text-dim);
      font-size: 14px;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .db-badge {
      background: rgba(0, 245, 212, 0.15);
      color: #00F5D4;
      border: 1px solid rgba(0, 245, 212, 0.4);
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 800;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: rgba(30, 41, 59, 0.7);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-wrap: wrap;
      justify-content: center;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background-color: var(--school-gold);
      color: #0F172A;
      box-shadow: 0 0 12px rgba(255, 209, 102, 0.4);
    }
    .score-list {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .score-item {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.2s, border-color 0.2s;
    }
    .score-item:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.15);
    }
    .score-item.rank-1 {
      border: 1px solid rgba(255, 209, 102, 0.6);
      background: linear-gradient(135deg, rgba(255, 209, 102, 0.1), var(--card-bg));
    }
    .rank-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      background: #334155;
      color: var(--text-main);
      margin-right: 14px;
      flex-shrink: 0;
    }
    .rank-1 .rank-badge { background: #FFD166; color: #0F172A; }
    .rank-2 .rank-badge { background: #E2E8F0; color: #0F172A; }
    .rank-3 .rank-badge { background: #CD7F32; color: #FFFFFF; }
    .player-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .player-name {
      font-size: 15px;
      font-weight: 700;
    }
    .player-date {
      font-size: 11px;
      color: var(--text-dim);
    }
    .player-score {
      font-size: 18px;
      font-weight: 800;
      color: var(--school-gold);
    }
    .empty-msg {
      text-align: center;
      padding: 40px;
      color: var(--text-dim);
      font-size: 14px;
    }
    .actions {
      margin-top: 24px;
      display: flex;
      gap: 12px;
    }
    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }
    .btn-secondary {
      background: #334155;
      color: var(--text-main);
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">🏆 우리 학교 <span>명예의 전당</span></div>
    <div class="subtitle">
      <span>로컬 스토리지 연동</span>
      <span class="db-badge">⚡ Offline Safe DB</span>
    </div>
  </div>

  <div class="tabs">
    <button id="tab-pacman" class="tab-btn active" onclick="switchTab('pacman')">🟡 팩맨</button>
    <button id="tab-dino" class="tab-btn" onclick="switchTab('dino')">🦖 공룡 달리기</button>
    <button id="tab-snake" class="tab-btn" onclick="switchTab('snake')">🐍 스네이크</button>
    <button id="tab-solitaire" class="tab-btn" onclick="switchTab('solitaire')">🃏 솔리테어</button>
    <button id="tab-tetris" class="tab-btn" onclick="switchTab('tetris')">🧱 테트리스</button>
  </div>

  <div id="score-container" class="score-list">
    <div class="empty-msg">기록 수신 중...</div>
  </div>

  <div class="actions">
    <button class="btn btn-secondary" onclick="renderScores()">🔄 새로고침</button>
  </div>

  <script>
    let currentTab = 'pacman';

    function getLeaderboard(gameKey) {
      try {
        const stored = localStorage.getItem(`school_leaderboard_${gameKey}`) || localStorage.getItem(`dochon_leaderboard_${gameKey}`);
        if (stored) return JSON.parse(stored);
      } catch (e) {}

      const fallbackMap = {
        pacman: [
          { id: '1', name: '김학생 (5A)', score: 12400, date: '2026-08-12' },
          { id: '2', name: '이슬기 (4B)', score: 9800, date: '2026-08-12' },
          { id: '3', name: '박민준 (6C)', score: 8500, date: '2026-08-11' },
          { id: '4', name: '최하은 (3A)', score: 6200, date: '2026-08-10' },
          { id: '5', name: '정우진 (5B)', score: 4900, date: '2026-08-09' }
        ],
        dino: [
          { id: '1', name: '박민준 (6C)', score: 3450, date: '2026-08-12' },
          { id: '2', name: '김학생 (5A)', score: 2890, date: '2026-08-12' },
          { id: '3', name: '윤서연 (4A)', score: 2100, date: '2026-08-11' },
          { id: '4', name: '강현우 (6A)', score: 1750, date: '2026-08-10' }
        ]
      };

      return fallbackMap[gameKey] || [];
    }

    function switchTab(tabKey) {
      currentTab = tabKey;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`tab-${tabKey}`);
      if (activeBtn) activeBtn.classList.add('active');
      renderScores();
    }

    function renderScores() {
      const container = document.getElementById('score-container');
      const list = getLeaderboard(currentTab);

      if (!list || list.length === 0) {
        container.innerHTML = '<div class="empty-msg">아직 등록된 명예의 전당 점수가 없습니다.</div>';
        return;
      }

      container.innerHTML = list.map((item, index) => {
        const rank = index + 1;
        const rankClass = rank <= 3 ? `rank-${rank}` : '';
        return `
          <div class="score-item ${rankClass}">
            <div class="rank-badge">${rank}</div>
            <div class="player-info">
              <div class="player-name">${item.name}</div>
              <div class="player-date">${item.date || '2026-08-13'}</div>
            </div>
            <div class="player-score">${Number(item.score).toLocaleString()}점</div>
          </div>
        `;
      }).join('');
    }

    renderScores();
  </script>
</body>
</html>

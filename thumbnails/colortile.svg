<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Underwater Deep Ocean Gradient -->
    <radialGradient id="oceanBg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#4CC9F0"/>
      <stop offset="50%" stop-color="#4361EE"/>
      <stop offset="100%" stop-color="#3A0CA3"/>
    </radialGradient>

    <!-- 3D Tile Board Gradients -->
    <linearGradient id="tileTop1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72EFDD"/><stop offset="100%" stop-color="#00F5D4"/>
    </linearGradient>
    <linearGradient id="tileTop2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF77BC"/><stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>
    <linearGradient id="tileTop3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEA00"/><stop offset="100%" stop-color="#FFB703"/>
    </linearGradient>

    <!-- Bubbly Text Gradients -->
    <linearGradient id="colorTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>

    <filter id="shadow3D" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0B0F19" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="36" fill="url(#oceanBg)"/>

  <!-- Bubbles -->
  <circle cx="70" cy="120" r="10" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="330" cy="160" r="14" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="90" cy="240" r="8" fill="#FFFFFF" opacity="0.45"/>

  <!-- 3D Isometric Puzzle Matrix Board (Matches Minesweeper Octopus Style) -->
  <g transform="translate(200, 245) scale(1, 0.55) rotate(45)" filter="url(#shadow3D)">
    <rect x="-135" y="-135" width="270" height="270" rx="22" fill="#1E1B4B" stroke="#4361EE" stroke-width="8"/>
    
    <!-- 3x3 Color Tiles -->
    <rect x="-120" y="-120" width="75" height="75" rx="12" fill="url(#tileTop1)" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="-37" y="-120" width="75" height="75" rx="12" fill="url(#tileTop2)" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="45" y="-120" width="75" height="75" rx="12" fill="url(#tileTop3)" stroke="#FFFFFF" stroke-width="3"/>

    <rect x="-120" y="-37" width="75" height="75" rx="12" fill="url(#tileTop3)" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="-37" y="-37" width="75" height="75" rx="12" fill="url(#tileTop1)" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="45" y="-37" width="75" height="75" rx="12" fill="url(#tileTop2)" stroke="#FFFFFF" stroke-width="3"/>

    <rect x="-120" y="45" width="75" height="75" rx="12" fill="url(#tileTop2)" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="-37" y="45" width="75" height="75" rx="12" fill="url(#tileTop3)" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="45" y="45" width="75" height="75" rx="12" fill="url(#tileTop1)" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <!-- Cute 3D Purple Octopus Mascot Centerpiece -->
  <g transform="translate(200, 160)" filter="url(#shadow3D)">
    <!-- Tentacles -->
    <path d="M-40,20 Q-70,40 -50,60 Q-30,40 -20,20" fill="#7209B7"/>
    <path d="M40,20 Q70,40 50,60 Q30,40 20,20" fill="#7209B7"/>
    <path d="M-20,30 Q-30,70 0,65 Q10,40 0,30" fill="#9D4EDD"/>

    <!-- Head Body -->
    <circle cx="0" cy="0" r="42" fill="#7209B7"/>
    <circle cx="-12" cy="-12" r="14" fill="#9D4EDD" opacity="0.6"/>

    <!-- Cute Eyes -->
    <ellipse cx="-15" cy="-2" rx="7" ry="10" fill="#FFFFFF"/>
    <ellipse cx="15" cy="-2" rx="7" ry="10" fill="#FFFFFF"/>
    <circle cx="-13" cy="-2" r="4" fill="#0F172A"/>
    <circle cx="17" cy="-2" r="4" fill="#0F172A"/>
    <circle cx="-15" cy="-5" r="2" fill="#FFFFFF"/>
    <circle cx="15" cy="-5" r="2" fill="#FFFFFF"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="-24" cy="12" rx="6" ry="4" fill="#FF77BC" opacity="0.7"/>
    <ellipse cx="24" cy="12" rx="6" ry="4" fill="#FF77BC" opacity="0.7"/>
  </g>

  <!-- Bubbly 3D Header Text "COLOR TILES" -->
  <g filter="url(#shadow3D)">
    <text x="200" y="65" font-family="'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="38" fill="url(#colorTextGrad)" stroke="#1E1B4B" stroke-width="8" stroke-linejoin="round" text-anchor="middle" letter-spacing="1">
      COLOR TILES
    </text>
    <text x="200" y="65" font-family="'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="38" fill="url(#colorTextGrad)" text-anchor="middle" letter-spacing="1">
      COLOR TILES
    </text>
  </g>

  <rect x="4" y="4" width="392" height="392" rx="32" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.3"/>
</svg>

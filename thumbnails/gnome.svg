<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Sky & Garden Gradient -->
    <linearGradient id="gnomeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4CC9F0"/>
      <stop offset="45%" stop-color="#80E9FF"/>
      <stop offset="46%" stop-color="#52B788"/>
      <stop offset="100%" stop-color="#1B4332"/>
    </linearGradient>

    <!-- Isometric 3D Lawn Grid Gradient -->
    <linearGradient id="lawnTile1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74C69D"/><stop offset="100%" stop-color="#40916C"/>
    </linearGradient>
    <linearGradient id="lawnTile2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#95D5B2"/><stop offset="100%" stop-color="#52B788"/>
    </linearGradient>

    <!-- 3D Puffy Title Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF756"/>
      <stop offset="50%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#FF9F1C"/>
    </linearGradient>
    <linearGradient id="titleStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D90429"/><stop offset="100%" stop-color="#7A0010"/>
    </linearGradient>

    <!-- Gnome 3D Character Gradients -->
    <radialGradient id="gnomeHat3D" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF758F"/>
      <stop offset="40%" stop-color="#FF0054"/>
      <stop offset="100%" stop-color="#800020"/>
    </radialGradient>
    <radialGradient id="gnomeSkin3D" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFF0ED"/>
      <stop offset="70%" stop-color="#FFD7BA"/>
      <stop offset="100%" stop-color="#F4A261"/>
    </radialGradient>
    <radialGradient id="apple3D" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF758F"/>
      <stop offset="50%" stop-color="#D90429"/>
      <stop offset="100%" stop-color="#590D22"/>
    </radialGradient>

    <!-- 3D Heavy Drop Shadows -->
    <filter id="drop3D" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0B0F19" flood-opacity="0.5"/>
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="400" height="400" rx="36" fill="url(#gnomeBg)"/>

  <!-- Sun & Clouds -->
  <circle cx="330" cy="70" r="55" fill="#FFF756" opacity="0.9" filter="blur(4px)"/>
  <ellipse cx="60" cy="80" rx="45" ry="22" fill="#FFFFFF" opacity="0.85"/>
  <ellipse cx="90" cy="75" rx="35" ry="25" fill="#FFFFFF" opacity="0.9"/>

  <!-- Isometric 3D Garden Lawn Stage -->
  <g transform="translate(200, 260) scale(1, 0.55) rotate(45)" filter="url(#drop3D)">
    <!-- Base 3D Platform Box -->
    <rect x="-130" y="-130" width="260" height="260" rx="20" fill="#2D6A4F" stroke="#1B4332" stroke-width="8"/>
    <!-- Grass Checker Tiles -->
    <rect x="-120" y="-120" width="115" height="115" rx="8" fill="url(#lawnTile1)"/>
    <rect x="5" y="-120" width="115" height="115" rx="8" fill="url(#lawnTile2)"/>
    <rect x="-120" y="5" width="115" height="115" rx="8" fill="url(#lawnTile2)"/>
    <rect x="5" y="5" width="115" height="115" rx="8" fill="url(#lawnTile1)"/>
  </g>

  <!-- 3D Shiny Red Apples on Lawn -->
  <g filter="url(#drop3D)">
    <circle cx="100" cy="270" r="16" fill="url(#apple3D)"/>
    <circle cx="95" cy="265" r="4" fill="#FFFFFF" opacity="0.8"/>
    <path d="M100,254 Q104,248 108,252" fill="none" stroke="#2D6A4F" stroke-width="3" stroke-linecap="round"/>

    <circle cx="300" cy="285" r="18" fill="url(#apple3D)"/>
    <circle cx="294" cy="279" r="4.5" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Cute 3D Garden Gnome Mascot Centerpiece -->
  <g transform="translate(195, 135)" filter="url(#drop3D)">
    <!-- Pointy Red 3D Hat -->
    <path d="M-5,10 Q-35,-105 0,-115 Q35,-105 15,10 Z" fill="url(#gnomeHat3D)"/>
    <!-- Specular Highlight on Hat -->
    <path d="M-12,-85 Q0,-40 -5,5" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

    <!-- Fluffy 3D White Beard -->
    <path d="M-38,5 C-50,60 -20,85 0,85 C20,85 50,60 38,5 Z" fill="#FFFFFF" filter="url(#drop3D)"/>
    <path d="M-20,20 C-30,55 -10,70 0,70 C10,70 30,55 20,20 Z" fill="#F8FAF9"/>

    <!-- Face Skin & Bulbous Nose -->
    <circle cx="0" cy="0" r="24" fill="url(#gnomeSkin3D)"/>
    <circle cx="0" cy="4" r="11" fill="#FFB5A7" filter="url(#drop3D)"/>
    <circle cx="-3" cy="2" r="3.5" fill="#FFFFFF" opacity="0.75"/>

    <!-- Cute Big Eyes -->
    <ellipse cx="-13" cy="-7" rx="5" ry="7" fill="#1D3557"/>
    <ellipse cx="13" cy="-7" rx="5" ry="7" fill="#1D3557"/>
    <circle cx="-14" cy="-9" r="2.5" fill="#FFFFFF"/>
    <circle cx="12" cy="-9" r="2.5" fill="#FFFFFF"/>

    <!-- Rosy Cheeks -->
    <circle cx="-20" cy="3" r="6" fill="#FF758F" opacity="0.5"/>
    <circle cx="20" cy="3" r="6" fill="#FF758F" opacity="0.5"/>
  </g>

  <!-- Puffy 3D Game Title Banner "GNOME KING" at Top (Matches Snake King Style) -->
  <g filter="url(#textGlow)">
    <!-- Banner Backdrop Pill -->
    <rect x="35" y="18" width="330" height="68" rx="24" fill="#0F172A" opacity="0.3"/>
    
    <!-- 3D Outlined Bubbly Text -->
    <text x="200" y="65" font-family="'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="38" fill="url(#titleGrad)" stroke="url(#titleStroke)" stroke-width="7" stroke-linejoin="round" text-anchor="middle" letter-spacing="1">
      GARDEN GNOMES
    </text>
    <text x="200" y="65" font-family="'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="38" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="1">
      GARDEN GNOMES
    </text>
  </g>

  <!-- 3D Glossy Card Frame Border -->
  <rect x="4" y="4" width="392" height="392" rx="32" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.3"/>
</svg>

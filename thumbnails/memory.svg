<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="memBg" x1="50%" y1="50%" r="70%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="60%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </radialGradient>
    <radialGradient id="brainGlow" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E0AAFF"/>
      <stop offset="100%" stop-color="#7209B7"/>
    </radialGradient>
    <filter id="memShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#memBg)"/>

  <!-- 3D Glass Brain Light Bulb -->
  <g transform="translate(200, 160)" filter="url(#memShadow)">
    <circle cx="-42" cy="-20" r="38" fill="url(#brainGlow)"/>
    <circle cx="42" cy="-20" r="38" fill="url(#brainGlow)"/>
    <circle cx="0" cy="20" r="46" fill="url(#brainGlow)"/>
    
    <!-- Giant Question Mark -->
    <text x="0" y="30" font-family="'Outfit', sans-serif" font-weight="900" font-size="65" fill="#FFFFFF" text-anchor="middle" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.4))">?</text>
  </g>

  <!-- Floating Match Cards -->
  <g transform="translate(80, 100) rotate(-15)" filter="url(#memShadow)">
    <rect x="0" y="0" width="50" height="70" rx="8" fill="#FFD166" stroke="#FFFFFF" stroke-width="2"/>
    <text x="25" y="46" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" fill="#7209B7" text-anchor="middle">★</text>
  </g>

  <g transform="translate(270, 90) rotate(15)" filter="url(#memShadow)">
    <rect x="0" y="0" width="50" height="70" rx="8" fill="#FFD166" stroke="#FFFFFF" stroke-width="2"/>
    <text x="25" y="46" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" fill="#7209B7" text-anchor="middle">★</text>
  </g>

  <!-- Title Badge Banner -->
  <rect x="50" y="325" width="300" height="52" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#00F5D4" stroke-width="2" filter="url(#memShadow)"/>
  <text x="200" y="361" font-family="'Outfit', sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" text-anchor="middle">기억력 게임 (Memory)</text>
</svg>
